<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:,">
    <title>Blind theme comparison</title>
    <link rel="stylesheet" href="generated/palette.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="generated/palette.js"></script>
    <script defer src="generated/comparisons.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="blind-audit" aria-labelledby="audit-title">
      <header class="audit-meta">
        <div class="progress-summary">
          <span id="audit-progress">Preparing shuffled test</span>
          <div class="progress-track" aria-hidden="true"><i id="progress-fill"></i></div>
        </div>
        <div class="audit-tools">
          <button type="button" class="quiet-button" id="copy-audit" hidden>Copy results</button>
          <button type="button" class="quiet-button" id="export-audit" hidden>Export results</button>
          <button type="button" class="quiet-button" id="restart-audit">Shuffle &amp; restart</button>
        </div>
      </header>

      <section class="audit-step">
        <div class="step-heading">
          <span class="step-number" id="step-number"></span>
          <h1 id="audit-title">Choose the light mode</h1>
          <p id="audit-instruction">Choose only by appearance. Theme identities are hidden.</p>
        </div>
        <div class="blind-stage" id="blind-stage"></div>
      </section>

      <footer class="audit-actions">
        <button type="button" class="quiet-button" id="skip-matchup">Skip matchup</button>
        <span id="audit-status" aria-live="polite"></span>
        <button type="button" class="primary-button" id="continue-audit" disabled>Continue to dark</button>
      </footer>
    </main>
  </body>
</html>
