<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:,">
    <title>Theme comparison</title>
    <link rel="stylesheet" href="generated/palette.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="generated/palette.js"></script>
    <script defer src="generated/comparisons.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#comparison-grid">Skip to comparisons</a>

    <header class="audit-bar">
      <h1>Theme comparison</h1>
      <div class="controls" aria-label="Comparison controls">
        <fieldset>
          <legend>Mode</legend>
          <button type="button" class="mode-button is-active" data-mode="both" aria-pressed="true">Both</button>
          <button type="button" class="mode-button" data-mode="light" aria-pressed="false">Light</button>
          <button type="button" class="mode-button" data-mode="dark" aria-pressed="false">Dark</button>
        </fieldset>
        <label for="sample-select">Sample
          <select id="sample-select">
            <option value="typescript">TypeScript</option>
            <option value="rust">Rust</option>
            <option value="python">Python</option>
            <option value="lua">Lua</option>
            <option value="diff">Git diff</option>
            <option value="markdown">Markdown</option>
          </select>
        </label>
        <span class="mapping-label">Normalized token roles</span>
      </div>
      <p id="control-status" class="sr-only" aria-live="polite">Both modes visible. TypeScript sample selected.</p>
    </header>

    <main>
      <section class="comparison-grid" id="comparison-grid" aria-label="Colour scheme comparisons"></section>
    </main>
  </body>
</html>
